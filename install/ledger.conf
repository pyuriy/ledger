# Drop-in site for Rocky Linux nginx.
# This host serves only Ledger. It is marked default_server so
# http://<this-host>/ opens the app instead of the nginx welcome page.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ledger;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
